spring.application.name=api-gateway

# API Gateway config

spring.cloud.gateway.server.webmvc.routes[0].id=order-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/orders/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=2
#spring.cloud.gateway.server.webmvc.routes[0].filters[1]=RedirectTo=302,http://youtube.com

spring.cloud.gateway.server.webmvc.routes[1].id=inventory-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/inventory/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[1].filters[1]=AddRequestHeader=X-Custom-Header,ABCD

# Eureka Client config
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true